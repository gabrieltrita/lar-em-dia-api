maintenance_cleanup:
  cron: "0 6 * * *"
  class: "MaintenanceCleanupJob"
  queue: default
  description: "Remove refresh tokens expirados e cadastros não confirmados"

due_alerts:
  cron: "0 * * * *"
  class: "DueAlertsJob"
  queue: default
  description: "Emails due-date alerts to users at 8h in their own time zone"

market_data_sync:
  cron: "0 7 * * 2-6 America/Sao_Paulo"
  class: "MarketDataSyncJob"
  queue: default
  description: "Imports the previous trading day's closing quotes of stocks and FIIs from B3"

interest_rate_sync:
  cron: "0 8 * * 2-6 America/Sao_Paulo"
  class: "InterestRateSyncJob"
  queue: default
  description: "Imports the Selic, CDI, savings and Selic target rates of the last 15 days from the Central Bank"
