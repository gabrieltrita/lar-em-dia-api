openapi: 3.1.0
info:
  title: laremdia-api
  version: 1.0.0
  description: |
    Base API for the Lar em Dia apps.

    **Authentication:** send `Authorization: Bearer <access_token>`. Access tokens last 15 minutes;
    call `POST /auth/refresh` to renew. On a 401, refresh once and retry the request.

    **Cookie mode (browser SPA):** send the `X-Token-Transport: cookie` header on login, refresh and confirmation.
    The refresh token is then delivered only in an httpOnly cookie (`<slug>_refresh`, `laremdia_refresh` for this app) and omitted from the JSON. Use `credentials: "include"` with fetch.

    **Format:** success `{ "data": ..., "meta": ... }` · error `{ "error": { "code", "message", "details" } }`.

    **Translating errors:** messages are in English. Clients must translate using the stable `error.code`
    (and `details[field][].code` for validation errors), never by matching the message text.

    | code | status | meaning |
    |---|---|---|
    | `validation_failed` | 422 | Invalid payload, see `details` |
    | `bad_request` | 400 | Missing parameter or malformed JSON |
    | `invalid_date` | 400 | A date query parameter is not `YYYY-MM-DD` |
    | `invalid_month` | 400 | A month query parameter (such as `from` or `projection_from`) is not `YYYY-MM` |
    | `invalid_months` | 400 | `months` (or `projection_months`) is not an integer from 1 to 60 or `all` |
    | `invalid_filter` | 400 | An indicator filter of `GET /assets` is not an integer |
    | `invalid_sort` | 400 | `sort` of `GET /assets` is not an indicator or `ticker`, or `direction` is not `asc` or `desc` |
    | `missing_token` | 401 | No `Authorization` header, or no refresh cookie on `POST /auth/refresh` in cookie mode |
    | `invalid_token` | 401 | Invalid, expired or wrong-type token |
    | `token_revoked` | 401 | Access token revoked by logout |
    | `session_revoked` | 401 | Session ended (device removed, all sessions revoked) |
    | `session_expired` | 401 | Token issued before a password change |
    | `refresh_token_reused` | 401 | Rotated refresh token reused; every session revoked |
    | `invalid_credentials` | 401 | Wrong email or password, or locked or deactivated account |
    | `invalid_two_factor_code` | 401/422 | Wrong TOTP or backup code |
    | `two_factor_challenge_expired` | 401 | Login 2FA challenge already used or expired |
    | `invalid_confirmation_token` | 401 | Bad or expired email confirmation link |
    | `invalid_email_change_token` | 401 | Bad or expired email change link |
    | `invalid_unsubscribe_token` | 401 | Bad or expired due-date alerts unsubscribe link |
    | `invalid_reset_token` | 401 | Bad or expired password reset link |
    | `invalid_unlock_token` | 401 | Bad or expired unlock link, or the account is no longer locked |
    | `oauth_token_invalid` | 401 | Provider ID token is invalid, expired or for another client |
    | `oauth_email_unverified` | 401 | Provider says the email is not verified |
    | `email_not_confirmed` | 403 | Correct password but email not confirmed yet |
    | `forbidden` | 403 | Not allowed |
    | `two_factor_setup_required` | 403 | Admin must enable 2FA first |
    | `two_factor_required` | 403 | Admins cannot disable 2FA |
    | `not_found` | 404 | Resource not found |
    | `invalid_current_password` | 422 | Wrong current password on a sensitive action |
    | `reauthentication_unavailable` | 422 | Account has no password, no 2FA and sent no provider token |
    | `invalid_provider_token` | 422 | The provider token used to re-authenticate is invalid or belongs to another account |
    | `provider_unavailable` | 422 | The provider token could not be checked because the provider was unreachable; retry |
    | `identity_already_linked` | 422 | That provider account is already linked, or the user already has one for the provider |
    | `last_login_method` | 422 | Cannot remove the only way to log in |
    | `two_factor_already_enabled` | 422 | 2FA is already enabled |
    | `two_factor_not_enabled` | 422 | 2FA is not enabled |
    | `consent_required` | 422 | Required consent cannot be revoked |
    | `only_for_single_entry` | 422 | `status` or `paid_on` changed with an entry `scope` other than `one` |
    | `installment_amount_locked` | 422 | An installment's `amount_cents` changed with a `scope` other than `one` |
    | `insufficient_quantity` | 422 | Deleting an investment transaction would leave a later sale without enough shares |
    | `insufficient_reserve` | 422 | Deleting an emergency reserve movement, or undoing an allocation that deposited into the reserve, would leave a later withdrawal without enough money |
    | `rate_limited` | 429 | Too many requests, see `Retry-After` |
    | `internal_error` | 500 | Unexpected error |
    | `oauth_provider_unavailable` | 503 | The provider's signing keys could not be fetched |

    Validation `details` codes include Rails defaults (`blank`, `invalid`, `too_short`, `too_long`, `confirmation`, `inclusion`)
    plus `weak_password`, `required`, `same_as_current`, `taken`, `greater_than`, `not_an_integer`, `in_future` (balance date),
    `only_when_paid` (entry `paid_on` while pending), `inactive` (category no longer offered), `only_for_expenses`
    (`nature` on an income entry, `kind` on an installments series of income) and `not_a_number`,
    `greater_than_or_equal_to`, `less_than_or_equal_to` (series `entries_count` and `total_cents`, and amounts above
    100,000,000,000.00 or a balance below its negative) and `present` (series `entries_count` and `total_cents`), and
    `immutable` (a category's `key` or `kind` after it is created, or an investment transaction's `ticker`),
    `unknown_asset` (a `ticker` that is not in the catalog, or a distribution's `ticker` without a position),
    `stock_only` (a distribution recorded by hand on an FII), `before_record_on` (a distribution paid before its record
    date), `no_income_data` (a simulation `ticker` without a price or distributions to project), `insufficient_quantity` (a transaction that would leave the
    position below zero shares on some day) and `only_for_trades` (`price_cents`, `fees_cents` or `debit_balance` on a
    split, reverse split or bonus), `rate_required` and `rate_not_allowed` (a reserve account's `cdi_percent_bps` or
    `annual_rate_bps` missing for its kind, or sent to a kind that does not use it), `insufficient_reserve` (a
    withdrawal larger than the account holds on its date), `anchor_not_allowed` (`debit_balance` on a reserve balance
    anchor) and `required` (a reserve movement's account, an allocation's `target` or a destination's
    `reserve_account_id` or `category_id` that does not exist or belongs to someone else), `inclusion` (a destination's
    `category_id` that is an income category or no longer active), `blank` and `present` (a destination's
    `amount_cents` or `percent_bps` missing for its mode, or sent to a mode that does not use it) and `in_future` (an
    allocation in a month after the current one).
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Me
  - name: Admin
  - name: Categories
    description: Catalog of income and expense categories. Clients label them by `key`.
  - name: Balances
    description: Anchor balances (amount at a date) that projections start from. Amounts are integer cents (BRL).
  - name: Entries
    description: Income and expenses on a date. Amounts are positive integer cents (BRL); the kind comes from the category, and an expense's
      nature (fixed or variable) defaults to the category's `default_nature`.
  - name: Projection
    description: Month by month balance projection built from the latest balance and the entries' due dates.
  - name: Investments
    description: The user's portfolio, built from their transactions. Amounts are integer cents (BRL) and per-share prices
      with more decimals are integers in `_e8` (hundred-millionths of a real). Informational only, never investment advice.
  - name: Reserve
    description: The emergency reserve, built from the user's accounts and movements and valued with the Selic, CDI and
      savings rates published by the Central Bank (SGS series 11, 12, 195 and 432). Amounts are integer cents (BRL) and
      rates are integers in `_e8` (hundred-millionths). Informational only, never investment advice.
  - name: Allocations
    description: Destinations of the month's leftover balance (fixed investments, charity, the emergency reserve) by fixed
      amount, percentage or the remainder. Using one records a paid expense, so it comes out of the month's closing
      balance; until then the balance stays. Amounts are integer cents (BRL).
  - name: Assets
    description: Catalog of stocks and FIIs listed on B3, with the closing quote of the latest trading day. Quotes come from
      B3's daily COTAHIST file and the registry (CNPJ, full name, sector or FII segment) from CVM open data (ODbL). Amounts
      are integer cents (BRL).
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Sign up (always 202 when the payload is valid)
      description: Never reveals whether the email exists. The email owner receives either a confirmation link or a sign-up attempt notice.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, first_name, accept_terms, accept_privacy]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72, description: Uppercase, lowercase and a digit }
                password_confirmation: { type: string }
                first_name: { type: string }
                last_name: { type: string }
                phone: { type: string }
                accept_terms: { type: boolean }
                accept_privacy: { type: boolean }
                accept_marketing: { type: boolean }
      responses:
        "202": { $ref: "#/components/responses/Message" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      description: |
        When the user has 2FA, the response carries `two_factor_required: true` and a `challenge_token`; finish with `POST /auth/two_factor`.
        A locked account responds exactly like a wrong password (401); the "account locked" email carries a link for `POST /auth/unlock`. An unconfirmed email responds 403 `email_not_confirmed` (only with the right password).
      security: []
      parameters:
        - $ref: "#/components/parameters/TokenTransport"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Session created or 2FA pending
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SessionResponse"
                  - $ref: "#/components/schemas/TwoFactorChallengeResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/two_factor:
    post:
      tags: [Auth]
      summary: Second login step (TOTP or backup code)
      security: []
      parameters:
        - $ref: "#/components/parameters/TokenTransport"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_token, code]
              properties:
                challenge_token: { type: string }
                code: { type: string, description: 6-digit authenticator code or a backup code }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange the refresh token for a new pair (rotation)
      description: >-
        Reusing an already rotated refresh token revokes every session of the user.
        Without a refresh token the answer is 400 `bad_request` in body mode and 401 `missing_token` in cookie mode,
        where a missing cookie means there is no session.
      security: []
      parameters:
        - $ref: "#/components/parameters/TokenTransport"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string, description: Optional in cookie mode }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    delete:
      tags: [Auth]
      summary: End the current session (or all of them)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                all_devices: { type: boolean }
      responses:
        "204": { description: Session ended }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/confirm:
    post:
      tags: [Auth]
      summary: Confirm the email and sign in
      security: []
      parameters:
        - $ref: "#/components/parameters/TokenTransport"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/confirm/resend:
    post:
      tags: [Auth]
      summary: Resend the confirmation link (always 202)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202": { $ref: "#/components/responses/Message" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/email/confirm:
    post:
      tags: [Auth]
      summary: Finish an email change (link sent to the new address)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Send the password reset link (always 202)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202": { $ref: "#/components/responses/Message" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Reset the password with the emailed token
      description: Revokes every session, unlocks the account and confirms the email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/unlock:
    post:
      tags: [Auth]
      summary: Unlock a locked account from the emailed link and sign in
      description: |
        The link is sent with the "account locked" email and works while the lock lasts. It responds like `POST /auth/login`:
        a session, or `two_factor_required: true` with a `challenge_token` when the user has 2FA.
      security: []
      parameters:
        - $ref: "#/components/parameters/TokenTransport"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200":
          description: Session created or 2FA pending
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SessionResponse"
                  - $ref: "#/components/schemas/TwoFactorChallengeResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/oauth/google:
    post:
      tags: [Auth]
      summary: Log in, link or sign up with a Google ID token
      description: |
        Known Google account logs in; the same email as an existing account links the identity (an unconfirmed account loses its password and sessions first); a new email creates a confirmed account.
        `accept_terms` and `accept_privacy` are required only when an account is created. An account with 2FA gets the usual `challenge_token`.
      security: []
      parameters:
        - $ref: "#/components/parameters/TokenTransport"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string }
                accept_terms: { type: boolean }
                accept_privacy: { type: boolean }
                accept_marketing: { type: boolean }
      responses:
        "200":
          description: Session created or 2FA pending
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SessionResponse"
                  - $ref: "#/components/schemas/TwoFactorChallengeResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: The provider's signing keys could not be fetched (`oauth_provider_unavailable`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/oauth/apple:
    post:
      tags: [Auth]
      summary: Log in, link or sign up with an Apple identity token
      description: |
        Same rules as Google. Apple does not put the name in the token: send `first_name` and `last_name` the first time; they are used only when the account is created and the token has no name.
        With Hide My Email the account email is an `@privaterelay.appleid.com` address and never matches an existing account.
        `accept_terms` and `accept_privacy` are required only when an account is created. An account with 2FA gets the usual `challenge_token`.
      security: []
      parameters:
        - $ref: "#/components/parameters/TokenTransport"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string }
                first_name: { type: string }
                last_name: { type: string }
                accept_terms: { type: boolean }
                accept_privacy: { type: boolean }
                accept_marketing: { type: boolean }
      responses:
        "200":
          description: Session created or 2FA pending
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SessionResponse"
                  - $ref: "#/components/schemas/TwoFactorChallengeResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: The provider's signing keys could not be fetched (`oauth_provider_unavailable`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /me:
    get:
      tags: [Me]
      summary: Current user profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Me]
      summary: Update name, phone and time zone (email has its own flow)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                phone: { type: string }
                time_zone: { type: string, example: America/Sao_Paulo, description: "IANA time zone name; anything else answers `inclusion`" }
      responses:
        "200": { description: Profile updated }
        "422": { $ref: "#/components/responses/ValidationError" }
    put:
      tags: [Me]
      summary: Same as PATCH
      responses:
        "200": { description: Profile updated }
    delete:
      tags: [Me]
      summary: Delete the account (LGPD anonymization)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password: { type: string, description: "Required when password_set is true" }
                code: { type: string, description: "Required when 2FA is enabled; also the way to re-authenticate when the account has no password" }
                apple_authorization_code: { type: string, description: "Fresh code from Sign in with Apple; when the user has an Apple identity the Apple token is revoked (best effort, never blocks the deletion)" }
                apple_client_id: { type: string, description: "Bundle id or Services ID that produced the code; defaults to the first of APPLE_CLIENT_IDS" }
      responses:
        "204": { description: Account anonymized }
        "422": { $ref: "#/components/responses/ReauthenticationFailed" }
  /me/password:
    patch:
      tags: [Me]
      summary: Change password (revokes every session and returns a new one)
      parameters:
        - $ref: "#/components/parameters/TokenTransport"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                current_password: { type: string, description: "Required when password_set is true" }
                code: { type: string, description: "Required when 2FA is enabled; also the way to re-authenticate when the account has no password" }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "422": { $ref: "#/components/responses/ReauthenticationFailed" }
  /me/email:
    patch:
      tags: [Me]
      summary: Request an email change (confirmed at the new address)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                current_password: { type: string, description: "Required when password_set is true" }
                code: { type: string, description: "Required when 2FA is enabled; also the way to re-authenticate when the account has no password" }
      responses:
        "202": { $ref: "#/components/responses/Message" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /me/export:
    get:
      tags: [Me]
      summary: Export all of the data subject's data (LGPD)
      responses:
        "200":
          description: JSON file (Content-Disposition attachment)
          content:
            application/json:
              schema:
                type: object
                properties:
                  exported_at: { type: string, format: date-time }
                  profile: { type: object }
                  consents: { type: array, items: { type: object } }
                  sessions: { type: array, items: { type: object } }
                  activity: { type: array, items: { type: object } }
                  content:
                    type: object
                    description: Personal content listed in User::PERSONAL_DATA, one key per association
                    properties:
                      identities: { type: array, items: { $ref: "#/components/schemas/Identity" } }
                      balances: { type: array, items: { $ref: "#/components/schemas/Balance" } }
                      entries: { type: array, items: { $ref: "#/components/schemas/Entry" } }
  /me/sessions:
    get:
      tags: [Me]
      summary: Active sessions (one per device)
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
  /me/sessions/{id}:
    delete:
      tags: [Me]
      summary: Revoke a session immediately
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Session ended }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/notification_settings:
    get:
      tags: [Me]
      summary: Due-date email alert preferences
      responses:
        "200": { $ref: "#/components/responses/NotificationSettings" }
    patch:
      tags: [Me]
      summary: Turn due-date email alerts on or off and choose how many days before
      description: |
        When on, an email lists the pending expenses due `due_alert_days_before` days ahead (0 is the same day). It is
        sent once a day, at 8h in the user's `time_zone`, only when there is something due.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettingsInput" }
      responses:
        "200": { $ref: "#/components/responses/NotificationSettings" }
        "422": { $ref: "#/components/responses/ValidationError" }
    put:
      tags: [Me]
      summary: Same as PATCH
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettingsInput" }
      responses:
        "200": { $ref: "#/components/responses/NotificationSettings" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /me/notification_settings/unsubscribe:
    post:
      tags: [Me]
      summary: Turn due-date email alerts off from the link in the email
      description: The alert email links to `FRONTEND_URL/unsubscribe?token=...`; the front end sends the token here. No login needed. The link lasts 60 days.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200": { $ref: "#/components/responses/NotificationSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/consents:
    get:
      tags: [Me]
      summary: Current consent status
      responses:
        "200":
          description: Per kind (terms, privacy, marketing)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: { $ref: "#/components/schemas/ConsentStatus" }
    post:
      tags: [Me]
      summary: Grant or revoke a consent (keeps history)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, granted]
              properties:
                kind: { type: string, enum: [terms, privacy, marketing] }
                granted: { type: boolean }
      responses:
        "201": { description: Recorded }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /me/identities:
    get:
      tags: [Me]
      summary: Linked social identities
      responses:
        "200":
          description: Identity list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Identity" }
    post:
      tags: [Me]
      summary: Link a social account to the logged-in user
      description: |
        Re-authenticates with `current_password`, or the 2FA `code` for accounts without a password. A provider token cannot re-authenticate this call, because `id_token` here is the account being linked.
        The email of the provider account may differ from the account's email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                provider: { type: string, enum: [google, apple] }
                id_token: { type: string }
                current_password: { type: string, description: "Required when password_set is true" }
                code: { type: string, description: "Required for accounts without a password; also when 2FA is enabled" }
      responses:
        "201":
          description: Identity linked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Identity" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422":
          description: Re-authentication failed, provider not supported, or `identity_already_linked`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: The provider's signing keys could not be fetched (`oauth_provider_unavailable`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /me/identities/{id}:
    delete:
      tags: [Me]
      summary: Unlink a social identity (cannot remove the only way to log in)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reauthentication" }
      responses:
        "204": { description: Identity unlinked }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Re-authentication failed (`invalid_current_password`, `invalid_two_factor_code`, `invalid_provider_token`, `provider_unavailable`, `reauthentication_unavailable`) or the identity is the only way to log in (`last_login_method`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /me/two_factor:
    get:
      tags: [Me]
      summary: 2FA status
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      required: { type: boolean }
                      backup_codes_remaining: { type: integer }
    delete:
      tags: [Me]
      summary: Disable 2FA (not allowed for admins)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reauthentication" }
      responses:
        "204": { description: Disabled }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ReauthenticationFailed" }
  /me/two_factor/setup:
    post:
      tags: [Me]
      summary: Step 1 — generate the secret and QR code (provisioning_uri)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password: { type: string, description: "Required when password_set is true" }
                code: { type: string, description: "Required when 2FA is enabled; also the way to re-authenticate when the account has no password" }
      responses:
        "200":
          description: Secret generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      secret: { type: string }
                      provisioning_uri: { type: string, description: Render as a QR code }
        "422": { $ref: "#/components/responses/ReauthenticationFailed" }
  /me/two_factor/enable:
    post:
      tags: [Me]
      summary: Step 2 — confirm with a code and enable (backup codes are returned only once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200": { $ref: "#/components/responses/BackupCodes" }
        "422": { $ref: "#/components/responses/ReauthenticationFailed" }
  /me/two_factor/backup_codes:
    post:
      tags: [Me]
      summary: Generate new backup codes (invalidates the previous ones)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reauthentication" }
      responses:
        "200": { $ref: "#/components/responses/BackupCodes" }
        "422": { $ref: "#/components/responses/ReauthenticationFailed" }
  /roles:
    get:
      tags: [Me]
      summary: List roles
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string, enum: [user, admin] }
                        label: { type: string }
  /admin/users:
    get:
      tags: [Admin]
      summary: List users (requires admin with 2FA)
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
        - { name: role, in: query, schema: { type: string, enum: [user, admin] } }
        - { name: email, in: query, description: Exact match, schema: { type: string } }
        - { name: status, in: query, description: Active or deactivated accounts; omitted lists both, schema: { type: string, enum: [active, deactivated] } }
      responses:
        "200":
          description: Page of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUser" }
                  meta: { $ref: "#/components/schemas/Pagination" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: Create a user (already confirmed)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserInput" }
      responses:
        "201": { description: Created }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Admin]
      summary: Show user
      responses:
        "200": { description: User }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Admin]
      summary: Update a user (role, password, profile)
      description: Changing the password revokes every session of the user. Admins cannot change their own role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserInput" }
      responses:
        "200": { description: Updated }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    put:
      tags: [Admin]
      summary: Same as PATCH
      responses:
        "200": { description: Updated }
    delete:
      tags: [Admin]
      summary: Anonymize the user (LGPD)
      responses:
        "204": { description: Anonymized }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/users/{id}/unlock:
    post:
      tags: [Admin]
      summary: Unlock the account
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Unlocked }
  /admin/users/{id}/deactivate:
    post:
      tags: [Admin]
      summary: Deactivate the account
      description: |
        Revokes every session and blocks login, refresh and social login (answered as `invalid_credentials`) until the
        account is reactivated. Data is kept. Audited as `user.deactivated` and the owner is emailed. Admins cannot
        deactivate themselves; an account already deactivated is returned unchanged.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/users/{id}/reactivate:
    post:
      tags: [Admin]
      summary: Reactivate the account
      description: Audited as `user.reactivated` and the owner is emailed; an active account is returned unchanged.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
  /admin/users/{id}/two_factor:
    delete:
      tags: [Admin]
      summary: Reset another user's 2FA (and revoke their sessions)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: 2FA reset }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/audit_logs:
    get:
      tags: [Admin]
      summary: Audit trail
      parameters:
        - { name: action_name, in: query, schema: { type: string }, example: user.role_changed }
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: target_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Page of events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AuditLog" }
                  meta: { $ref: "#/components/schemas/Pagination" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /categories:
    get:
      tags: [Categories]
      summary: List the active categories, by kind and position
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [income, expense] } }
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
  /balances:
    get:
      tags: [Balances]
      summary: List the current user's balances, most recent date first
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        "200":
          description: Page of balances
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Balance" }
                  meta: { $ref: "#/components/schemas/Pagination" }
    post:
      tags: [Balances]
      summary: Create a balance
      parameters:
        - $ref: "#/components/parameters/ProjectionFrom"
        - $ref: "#/components/parameters/ProjectionMonths"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BalanceInput" }
      responses:
        "201": { $ref: "#/components/responses/Balance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /balances/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Balances]
      summary: Show a balance
      description: Another user's record answers 404, not 403, so ids cannot be probed.
      responses:
        "200": { $ref: "#/components/responses/Balance" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Balances]
      summary: Update a balance
      parameters:
        - $ref: "#/components/parameters/ProjectionFrom"
        - $ref: "#/components/parameters/ProjectionMonths"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BalanceInput" }
      responses:
        "200": { $ref: "#/components/responses/Balance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    put:
      tags: [Balances]
      summary: Same as PATCH
      parameters:
        - $ref: "#/components/parameters/ProjectionFrom"
        - $ref: "#/components/parameters/ProjectionMonths"
      responses:
        "200": { $ref: "#/components/responses/Balance" }
    delete:
      tags: [Balances]
      summary: Delete a balance
      parameters:
        - $ref: "#/components/parameters/ProjectionFrom"
        - $ref: "#/components/parameters/ProjectionMonths"
      responses:
        "200": { $ref: "#/components/responses/Deleted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /entries:
    get:
      tags: [Entries]
      summary: List the current user's entries by due date
      parameters:
        - { name: from, in: query, description: First due date included, schema: { type: string, format: date } }
        - { name: to, in: query, description: Last due date included, schema: { type: string, format: date } }
        - { name: kind, in: query, schema: { type: string, enum: [income, expense] } }
        - { name: nature, in: query, schema: { type: string, enum: [fixed, variable] } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, description: Up to 500 entries per page, schema: { type: integer, maximum: 500 } }
      responses:
        "200":
          description: Page of entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Entry" }
                  meta: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [Entries]
      summary: Create an entry
      parameters:
        - $ref: "#/components/parameters/ProjectionFrom"
        - $ref: "#/components/parameters/ProjectionMonths"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntryInput" }
      responses:
        "201": { $ref: "#/components/responses/Entry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /entries/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Entries]
      summary: Show an entry
      description: Another user's record answers 404, not 403, so ids cannot be probed.
      responses:
        "200": { $ref: "#/components/responses/Entry" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Entries]
      summary: Update an entry
      description: |
        With `scope` `following` or `all` on an entry of a series, `category_id`, `nature`, `description` and
        `amount_cents` are applied to this entry and the following ones (or to every entry of the series), and a new
        `due_on` moves each of them by the same offset, keeping the series' `interval_months` and the month end
        adjustment of `POST /entry_series`. It is
        all or nothing. `status` and `paid_on` only change with `one` (`only_for_single_entry` otherwise), and an
        installment's `amount_cents` too (`installment_amount_locked`); sending them unchanged is accepted. An entry
        outside a series ignores `scope`. For an entry of a series, `meta.entries` lists every entry left in the
        series after the change, so clients can refresh them without another request.
      parameters:
        - $ref: "#/components/parameters/EntryScope"
        - $ref: "#/components/parameters/ProjectionFrom"
        - $ref: "#/components/parameters/ProjectionMonths"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntryInput" }
      responses:
        "200": { $ref: "#/components/responses/Entry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Invalid data (`validation_failed`), or a field that only changes with scope `one` (`only_for_single_entry`, `installment_amount_locked`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [Entries]
      summary: Same as PATCH
      parameters:
        - $ref: "#/components/parameters/EntryScope"
        - $ref: "#/components/parameters/ProjectionFrom"
        - $ref: "#/components/parameters/ProjectionMonths"
      responses:
        "200": { $ref: "#/components/responses/Entry" }
    delete:
      tags: [Entries]
      summary: Delete an entry
      description: |
        `scope` `following` deletes this entry and the following ones of its series and updates the series'
        `entries_count` (and `total_cents` for installments); `all` deletes the whole series. A series left without
        entries is deleted too. `data.deleted_ids` lists the deleted entries and, for an entry of a series,
        `meta.entries` lists the ones left in it.
      parameters:
        - $ref: "#/components/parameters/EntryScope"
        - $ref: "#/components/parameters/ProjectionFrom"
        - $ref: "#/components/parameters/ProjectionMonths"
      responses:
        "200": { $ref: "#/components/responses/Deleted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /entry_series:
    post:
      tags: [Entries]
      summary: Create a recurring or installments series of entries
      description: |
        Creates `entries_count` entries (the first included) on the same day of every month, or of every
        `interval_months` months; a month without that day uses its last day. Entries due up to today take the sent status (paid ones with `paid_on` on their due
        date); later ones are pending. All or nothing: an invalid entry answers the same `details` as `POST /entries`.

        - `recurring` (default): 2 to 36 entries of `amount_cents`, forwards or backwards from `due_on`, monthly
          (`interval_months` 1, the default), quarterly (3), semiannually (6) or yearly (12).
        - `installments`: expenses only, 2 to 48 entries, always monthly and forwards. `total_cents` is split into
          equal installments and the leftover cents go to the first one; `amount_cents`, `direction` and
          `interval_months` are ignored.
      parameters:
        - $ref: "#/components/parameters/ProjectionFrom"
        - $ref: "#/components/parameters/ProjectionMonths"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntrySeriesInput" }
      responses:
        "201":
          description: Series created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/EntrySeries" }
                  meta: { $ref: "#/components/schemas/ChangeMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /allocation_targets:
    get:
      tags: [Allocations]
      summary: List the destinations of the month's leftover balance, in their order
      responses:
        "200":
          description: Destinations
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AllocationTarget" }
    post:
      tags: [Allocations]
      summary: Create a destination for the month's leftover balance
      description: |
        A `fixed` destination takes `amount_cents` and a `percent` one takes `percent_bps` of the month's balance; the
        other value must be absent (`blank`, `present`). A `remainder` destination takes whatever the others leave, and a
        user has at most one (`taken` on `mode`). With `reserve_account_id`, using it deposits into that emergency reserve
        account. Without `position`, the destination goes after the last one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllocationTargetInput" }
      responses:
        "201": { $ref: "#/components/responses/AllocationTarget" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /allocation_targets/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Allocations]
      summary: Update a destination
      description: Changes the plan of every month that has not used it yet; amounts already used stay as they were.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllocationTargetInput" }
      responses:
        "200": { $ref: "#/components/responses/AllocationTarget" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    put:
      tags: [Allocations]
      summary: Same as PATCH
      responses:
        "200": { $ref: "#/components/responses/AllocationTarget" }
    delete:
      tags: [Allocations]
      summary: Delete a destination
      description: The expenses and reserve deposits it already created stay, because that money was used.
      responses:
        "200": { $ref: "#/components/responses/DeletedId" }
        "404": { $ref: "#/components/responses/NotFound" }
  /allocation_plan:
    get:
      tags: [Allocations]
      summary: How a month's leftover balance is split among the destinations
      description: |
        `closing_cents` is the month's projected closing balance (`GET /projection`) and `base_cents` adds back what was
        already used in the month, so using a destination never shrinks the others. Destinations are planned in order:
        used ones keep their amount, fixed and percentage ones take their value up to what is left, and the remainder
        takes the rest. Nothing is planned when the base is not positive.
      parameters:
        - { name: month, in: query, schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" }, description: Defaults to the current month }
      responses:
        "200":
          description: The month's plan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AllocationPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /allocations:
    post:
      tags: [Allocations]
      summary: Mark a destination as used in a month
      description: |
        Records the planned amount, or `amount_cents`, as a paid expense in the `surplus_allocation` category, today in
        the current month or on the last day of a past month, so it comes out of that month's closing balance. A
        destination linked to a reserve account records a reserve deposit with `debit_balance` instead (a paid expense
        in `reserve_deposit`). Future months are refused (`in_future` on `month`), a month uses each destination once
        (`taken`), the target must be the user's (`required` on `target`) and the amount must be positive
        (`greater_than`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id, month]
              properties:
                target_id: { type: string, format: uuid }
                month: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" }
                amount_cents: { type: integer, minimum: 1, maximum: 10000000000000, description: Defaults to the planned amount }
      responses:
        "201":
          description: Allocation used
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Allocation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /allocations/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [Allocations]
      summary: Undo a used allocation
      description: Deletes its expense, or its reserve deposit and the deposit's expense, so the balance goes back up.
      responses:
        "200": { $ref: "#/components/responses/DeletedId" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: A later reserve withdrawal would be left without enough money (`insufficient_reserve`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /projection:
    get:
      tags: [Projection]
      summary: Project the balance at the end of each month
      description: |
        The anchor is the most recent balance; without one it is zero and `anchor` is null. A month closes at the anchor
        plus income minus expenses due between the anchor date and the month's last day (worked backwards for months
        before the anchor). Pending and paid entries both count, by due date. Unless `include_investment_income` is
        `false`, the months after the current one also count the portfolio's forecast distributions as income (without
        creating entries). Each month also carries the portfolio value and the total net worth.
      parameters:
        - { name: from, in: query, description: First month; defaults to the current month, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", example: "2026-11" } }
        - name: include_investment_income
          in: query
          description: Add the forecast distributions of the portfolio, as in `GET /portfolio/income`, to the income of the months after the current one
          schema: { type: boolean, default: true }
        - name: months
          in: query
          description: Number of months, or `all` to project through the month of the user's last entry (at least 1 and at most 60 months)
          schema:
            oneOf:
              - { type: integer, minimum: 1, maximum: 60, default: 12 }
              - { type: string, enum: [all] }
      responses:
        "200":
          description: Month by month projection
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Projection" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /projection/simulation:
    post:
      tags: [Projection]
      summary: Simulate hypothetical entries without saving them
      description: |
        Answers the current projection (`baseline`) and the projection with up to 10 hypothetical entries added
        (`simulated`), both in the `GET /projection` format. Nothing is saved. Each item is validated like
        `POST /entries`, or like `POST /entry_series` when it has `entries_count`; errors are keyed by position, such as
        `entries.0.amount_cents`. To keep a simulation, send the same items to `POST /entries` or `POST /entry_series`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                from: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", example: "2026-11", description: First month; defaults to the current month }
                months:
                  description: Number of months, or `all` to project through the month of the last entry, simulated ones included (at most 60)
                  oneOf:
                    - { type: integer, minimum: 1, maximum: 60, default: 12 }
                    - { type: string, enum: [all] }
                entries:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required: [category_id, description, due_on]
                    properties:
                      category_id: { type: string, format: uuid }
                      nature: { type: [string, "null"], enum: [fixed, variable, null] }
                      description: { type: string, maxLength: 200 }
                      amount_cents: { type: integer, minimum: 1, maximum: 10000000000000, description: Not used for installments }
                      due_on: { type: string, format: date }
                      entries_count: { type: integer, minimum: 2, maximum: 48, description: Simulates a series, as in `POST /entry_series` }
                      kind: { type: string, enum: [recurring, installments], default: recurring }
                      direction: { type: string, enum: [forward, backward] }
                      interval_months: { type: integer, enum: [1, 3, 6, 12], default: 1, description: Recurring only }
                      total_cents: { type: integer, maximum: 10000000000000, description: Installments only }
      responses:
        "200":
          description: Baseline and simulated projections
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [baseline, simulated]
                    properties:
                      baseline: { $ref: "#/components/schemas/Projection" }
                      simulated: { $ref: "#/components/schemas/Projection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /investment_transactions:
    get:
      tags: [Investments]
      summary: List the current user's investment transactions by trade date
      parameters:
        - { name: ticker, in: query, schema: { type: string }, example: PETR4 }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        "200":
          description: Page of transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/InvestmentTransaction" }
                  meta: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [Investments]
      summary: Record a buy, sell, split, reverse split or bonus
      description: |
        The first transaction of a ticker opens the position, with `goal` or, without it, `income` for an FII and
        `growth` for a stock. For "I already hold X shares at an average price of Y", send a buy with that quantity
        and price. With `debit_balance`, a buy creates a paid expense in the `investment_contribution` category and a
        sell a paid income in `investment_redemption`, both on `traded_on`, so the projection counts the money.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvestmentTransactionInput" }
      responses:
        "201": { $ref: "#/components/responses/InvestmentTransaction" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /investment_transactions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Investments]
      summary: Show an investment transaction
      description: Another user's record answers 404, not 403, so ids cannot be probed.
      responses:
        "200": { $ref: "#/components/responses/InvestmentTransaction" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Investments]
      summary: Update an investment transaction
      description: |
        The `ticker` cannot change (`immutable`) and `goal` is ignored. The linked expense or income follows the new
        values; `debit_balance` `false` deletes it and `true` creates it. Without `debit_balance` the link is kept.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvestmentTransactionInput" }
      responses:
        "200": { $ref: "#/components/responses/InvestmentTransaction" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    put:
      tags: [Investments]
      summary: Same as PATCH
      responses:
        "200": { $ref: "#/components/responses/InvestmentTransaction" }
    delete:
      tags: [Investments]
      summary: Delete an investment transaction
      description: Also deletes its linked expense or income, and the position when it was its last transaction.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [deleted_id]
                    properties:
                      deleted_id: { type: string, format: uuid }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: A later sale would be left without enough shares (`insufficient_quantity`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /investment_positions/{ticker}:
    parameters:
      - { name: ticker, in: path, required: true, description: Case insensitive, schema: { type: string }, example: HGLG11 }
    patch:
      tags: [Investments]
      summary: Change the goal of a position
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goal]
              properties:
                goal: { type: string, enum: [income, growth] }
      responses:
        "200": { $ref: "#/components/responses/InvestmentPosition" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    put:
      tags: [Investments]
      summary: Same as PATCH
      responses:
        "200": { $ref: "#/components/responses/InvestmentPosition" }
  /portfolio:
    get:
      tags: [Investments]
      summary: Positions and totals of the current user's portfolio
      description: |
        Quantities and costs come from the transactions: the average price is weighted and includes fees, a sale
        removes shares at the average price, and splits, reverse splits and bonuses change the shares but not the
        cost. The market value uses the latest closing quote, or the cost when the asset has no quote.
      parameters:
        - { name: goal, in: query, schema: { type: string, enum: [income, growth] } }
        - { name: include_closed, in: query, description: Also list positions with zero shares, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Portfolio
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [totals, goals, positions]
                    properties:
                      totals: { $ref: "#/components/schemas/PortfolioTotals" }
                      goals:
                        type: object
                        required: [income, growth]
                        properties:
                          income: { $ref: "#/components/schemas/PortfolioTotals" }
                          growth: { $ref: "#/components/schemas/PortfolioTotals" }
                      positions:
                        type: array
                        items: { $ref: "#/components/schemas/PortfolioPosition" }
  /portfolio/history:
    get:
      tags: [Investments]
      summary: Month by month market value and net contributions
      description: |
        From the month of the first transaction to the current month (at most the last 120 months). Each month values
        the shares held on its last day at the last closing quote up to that day, or at cost when there is none.
      responses:
        "200":
          description: Months, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [month, contributed_cents, market_value_cents]
                      properties:
                        month: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", example: "2026-11" }
                        contributed_cents: { type: integer, description: Buys with fees minus sale proceeds net of fees, up to the month }
                        market_value_cents: { type: integer }
  /portfolio/income:
    get:
      tags: [Investments]
      summary: Distributions received and forecast for the current user's portfolio
      description: |
        A distribution counts in the month it is paid (FIIs from the CVM monthly report have no payment date and count
        in the month after the record date) for the shares held on the record date. JCP counts net of the 15% income
        tax. `received` covers the last 12 months, the current one included. Each month of `forecast` (after the
        current one) uses the distributions already announced for it or, without them, the average of the last 12
        months per share times the shares held today. Totals are rounded to cents once per month. Informational only,
        never investment advice.
      parameters:
        - { name: months, in: query, description: Months of forecast, schema: { type: integer, minimum: 1, maximum: 60, default: 12 } }
      responses:
        "200":
          description: Passive income
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [monthly_average_cents, received, forecast, positions]
                    properties:
                      monthly_average_cents: { type: integer, minimum: 0, description: Received in the last 12 months divided by 12 }
                      received:
                        type: array
                        items: { $ref: "#/components/schemas/IncomeMonth" }
                      forecast:
                        type: array
                        items: { $ref: "#/components/schemas/IncomeMonth" }
                      positions:
                        type: array
                        items:
                          type: object
                          required: [ticker, goal, quantity, received_12m_cents, monthly_forecast_cents]
                          properties:
                            ticker: { type: string }
                            goal: { type: string, enum: [income, growth] }
                            quantity: { type: integer, minimum: 0 }
                            received_12m_cents: { type: integer, minimum: 0 }
                            monthly_forecast_cents: { type: integer, minimum: 0, description: Average of the last 12 months per share times the shares held today }
        "400": { $ref: "#/components/responses/BadRequest" }
  /asset_distributions:
    get:
      tags: [Investments]
      summary: List the distributions the current user recorded by hand, newest first
      parameters:
        - { name: ticker, in: query, schema: { type: string }, example: PETR4 }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        "200":
          description: Page of distributions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AssetDistribution" }
                  meta: { $ref: "#/components/schemas/Pagination" }
    post:
      tags: [Investments]
      summary: Record a stock dividend or JCP by hand
      description: |
        There is no free official source of stock distributions, so the user records the ones they receive. Only
        stocks of the user's portfolio accept them (FII income comes from CVM), and they count only for that user.
        `amount_per_share_e8` is the gross value per share; JCP is shown and counted net of the 15% income tax.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetDistributionInput" }
      responses:
        "201": { $ref: "#/components/responses/AssetDistribution" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /asset_distributions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Investments]
      summary: Update a distribution recorded by hand
      description: The `ticker` cannot change (`immutable`). Another user's record answers 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetDistributionInput" }
      responses:
        "200": { $ref: "#/components/responses/AssetDistribution" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    put:
      tags: [Investments]
      summary: Same as PATCH
      responses:
        "200": { $ref: "#/components/responses/AssetDistribution" }
    delete:
      tags: [Investments]
      summary: Delete a distribution recorded by hand
      responses:
        "200": { $ref: "#/components/responses/DeletedId" }
        "404": { $ref: "#/components/responses/NotFound" }
  /reserve_accounts:
    get:
      tags: [Reserve]
      summary: List the current user's emergency reserve accounts, oldest first
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ReserveAccount" }
    post:
      tags: [Reserve]
      summary: Create an emergency reserve account
      description: |
        `cdi_percent_bps` is required for a `cdb` and `annual_rate_bps` for a `fixed_rate` account (`rate_required`);
        any other kind refuses them (`rate_not_allowed`). `tax_exempt` marks an LCI or LCA; savings and idle money are
        always exempt.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReserveAccountInput" }
      responses:
        "201": { $ref: "#/components/responses/ReserveAccount" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /reserve_accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Reserve]
      summary: Show an emergency reserve account
      description: Another user's record answers 404, not 403, so ids cannot be probed.
      responses:
        "200": { $ref: "#/components/responses/ReserveAccount" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Reserve]
      summary: Update an emergency reserve account
      description: Changing the kind recomputes the account from its movements; send the rate the new kind needs and `null` for the other.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReserveAccountInput" }
      responses:
        "200": { $ref: "#/components/responses/ReserveAccount" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    put:
      tags: [Reserve]
      summary: Same as PATCH
      responses:
        "200": { $ref: "#/components/responses/ReserveAccount" }
    delete:
      tags: [Reserve]
      summary: Delete an emergency reserve account
      description: Also deletes its movements and the expenses and income they created with `debit_balance`.
      responses:
        "200": { $ref: "#/components/responses/DeletedId" }
        "404": { $ref: "#/components/responses/NotFound" }
  /reserve_movements:
    get:
      tags: [Reserve]
      summary: List the current user's emergency reserve movements by date
      parameters:
        - { name: account_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        "200":
          description: Page of movements
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ReserveMovement" }
                  meta: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [Reserve]
      summary: Record a deposit, a withdrawal or the account's balance on a date
      description: |
        An `anchor` ("today I have X") restarts the account from its amount, which counts as one deposit made on its
        date for the income tax estimate. A withdrawal takes the gross amount from the oldest deposits first and
        cannot exceed what the account holds on its date (`insufficient_reserve`). With `debit_balance`, a deposit
        creates a paid expense in the `reserve_deposit` category and a withdrawal a paid income in
        `reserve_withdrawal`, both on `moved_on`; an anchor refuses it (`anchor_not_allowed`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReserveMovementInput" }
      responses:
        "201": { $ref: "#/components/responses/ReserveMovement" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /reserve_movements/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Reserve]
      summary: Show an emergency reserve movement
      description: Another user's record answers 404, not 403, so ids cannot be probed.
      responses:
        "200": { $ref: "#/components/responses/ReserveMovement" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Reserve]
      summary: Update an emergency reserve movement
      description: |
        The `account_id` cannot change (`immutable`). The linked expense or income follows the new values;
        `debit_balance` `false` deletes it and `true` creates it. Without `debit_balance` the link is kept.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReserveMovementInput" }
      responses:
        "200": { $ref: "#/components/responses/ReserveMovement" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    put:
      tags: [Reserve]
      summary: Same as PATCH
      responses:
        "200": { $ref: "#/components/responses/ReserveMovement" }
    delete:
      tags: [Reserve]
      summary: Delete an emergency reserve movement
      description: Also deletes its linked expense or income.
      responses:
        "200": { $ref: "#/components/responses/DeletedId" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: A later withdrawal would be left without enough money (`insufficient_reserve`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /reserve:
    get:
      tags: [Reserve]
      summary: The emergency reserve today, the suggested reserve and the alerts
      description: |
        Each account is valued from its movements: Treasury Selic by the daily Selic, a CDB by its percentage of the
        daily CDI, a fixed rate account by its annual rate over 252 business days, savings on each monthly
        anniversary (deposits on the 29th to the 31st count from the 1st) and idle money does not grow. Days the rates
        were not imported yet use the last known rate. `tax_cents` is the regressive income tax (22.5% up to 180 days,
        20% up to 360, 17.5% up to 720 and 15% after) on the gains of each deposit if everything were withdrawn today;
        IOF is ignored. The suggestion is `goal_months` times the average fixed expenses of the months that have
        any among the last three closed months, the current month and the next two, and is null without fixed
        expenses. Only numbers from the user's own data, never
        investment advice.
      responses:
        "200": { $ref: "#/components/responses/ReserveSummary" }
    patch:
      tags: [Reserve]
      summary: Change the reserve goal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReserveGoalInput" }
      responses:
        "200": { $ref: "#/components/responses/ReserveSummary" }
        "422": { $ref: "#/components/responses/ValidationError" }
    put:
      tags: [Reserve]
      summary: Same as PATCH
      responses:
        "200": { $ref: "#/components/responses/ReserveSummary" }
  /reserve/projection:
    get:
      tags: [Reserve]
      summary: Month by month gross and net value of the emergency reserve
      description: |
        From the current month, each account valued on the last day of the month. Future business days use the
        current Selic target (Treasury Selic), the target minus 0.10 point as the CDI estimate (CDB), the account's
        annual rate (fixed rate) or the last monthly savings yield. Future business days are Monday to Friday, without
        holidays.
      parameters:
        - { name: months, in: query, schema: { type: integer, minimum: 1, maximum: 60, default: 12 } }
      responses:
        "200":
          description: Months and assumptions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [months, assumptions]
                    properties:
                      months:
                        type: array
                        items:
                          type: object
                          required: [month, gross_cents, net_cents, accounts]
                          properties:
                            month: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", example: "2026-11" }
                            gross_cents: { type: integer }
                            net_cents: { type: integer }
                            accounts:
                              type: array
                              items:
                                type: object
                                required: [id, gross_cents, net_cents]
                                properties:
                                  id: { type: string, format: uuid }
                                  gross_cents: { type: integer }
                                  net_cents: { type: integer }
                      assumptions: { $ref: "#/components/schemas/ReserveAssumptions" }
        "400":
          description: "`months` is not an integer from 1 to 60 (`invalid_months`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /portfolio/simulation:
    post:
      tags: [Investments]
      summary: Simulate future income or growth of an investment, without saving anything
      description: |
        `income` buys whole shares every month at a constant price (the latest close of `ticker`) with the money
        contributed and, with `reinvest`, the income received, and pays each month the average monthly FII
        distribution per share of the last 12 months or, for stocks, a twelfth of `dy_12m_bps` times the price. Without
        `ticker`, `monthly_yield_bps` is applied to the value invested. `growth` compounds `initial_cents` and the
        contributions (at each month's end) at `annual_rate_bps`, chosen by the user. Past income and any rate never
        guarantee future results; informational only, never investment advice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, months]
              properties:
                kind: { type: string, enum: [income, growth] }
                initial_cents: { type: integer, minimum: 0, maximum: 100000000000, default: 0 }
                monthly_cents: { type: integer, minimum: 0, maximum: 100000000000, default: 0, description: At least one of the two amounts is positive }
                months: { type: integer, minimum: 1, maximum: 600 }
                ticker: { type: string, description: "`income`: the asset whose price and distributions are used" }
                monthly_yield_bps: { type: integer, minimum: 1, maximum: 1000, description: "`income` without `ticker`" }
                reinvest: { type: boolean, default: true, description: "`income`: reinvest what is received" }
                target_monthly_income_cents: { type: integer, minimum: 1, description: "`income`: the monthly income to reach" }
                annual_rate_bps: { type: integer, minimum: -9999, maximum: 10000, description: "`growth`: required" }
      responses:
        "200":
          description: Simulation
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/IncomeSimulation"
                      - $ref: "#/components/schemas/GrowthSimulation"
        "422": { $ref: "#/components/responses/ValidationError" }
  /assets:
    get:
      tags: [Assets]
      summary: List and filter the active stocks and FIIs
      description: |
        An asset is active while it has a quote in the last 30 days. The indicator filters (`<indicator>_min`,
        `<indicator>_max`, inclusive, in the indicator's own unit) leave out assets without that indicator. The list
        is only filtered and sorted, never ranked or recommended. Sorting by an indicator puts the assets without it
        last; the default direction is `desc` for indicators and `asc` for `ticker`.
      parameters:
        - { name: asset_type, in: query, schema: { type: string, enum: [stock, fii] } }
        - { name: sector, in: query, description: Exact sector or FII segment, schema: { type: string }, example: Logística }
        - { name: q, in: query, description: "Ticker prefix or any part of the name, case insensitive", schema: { type: string }, example: petr }
        - { name: paying, in: query, description: "`true` keeps only assets with a positive `dy_12m_bps`, which leaves out FIIs still in development", schema: { type: boolean } }
        - { name: dy_12m_bps_min, in: query, description: "Minimum `dy_12m_bps`, inclusive", schema: { type: integer } }
        - { name: dy_12m_bps_max, in: query, description: "Maximum `dy_12m_bps`, inclusive", schema: { type: integer } }
        - { name: payout_bps_min, in: query, description: "Minimum `payout_bps`, inclusive", schema: { type: integer } }
        - { name: payout_bps_max, in: query, description: "Maximum `payout_bps`, inclusive", schema: { type: integer } }
        - { name: p_vp_e2_min, in: query, description: "Minimum `p_vp_e2`, inclusive", schema: { type: integer } }
        - { name: p_vp_e2_max, in: query, description: "Maximum `p_vp_e2`, inclusive", schema: { type: integer } }
        - { name: p_l_e2_min, in: query, description: "Minimum `p_l_e2`, inclusive", schema: { type: integer } }
        - { name: p_l_e2_max, in: query, description: "Maximum `p_l_e2`, inclusive", schema: { type: integer } }
        - { name: roe_average_bps_min, in: query, description: "Minimum `roe_average_bps`, inclusive", schema: { type: integer } }
        - { name: roe_average_bps_max, in: query, description: "Maximum `roe_average_bps`, inclusive", schema: { type: integer } }
        - { name: earnings_cagr_bps_min, in: query, description: "Minimum `earnings_cagr_bps`, inclusive", schema: { type: integer } }
        - { name: earnings_cagr_bps_max, in: query, description: "Maximum `earnings_cagr_bps`, inclusive", schema: { type: integer } }
        - { name: equity_cagr_bps_min, in: query, description: "Minimum `equity_cagr_bps`, inclusive", schema: { type: integer } }
        - { name: equity_cagr_bps_max, in: query, description: "Maximum `equity_cagr_bps`, inclusive", schema: { type: integer } }
        - { name: net_margin_bps_min, in: query, description: "Minimum `net_margin_bps`, inclusive", schema: { type: integer } }
        - { name: net_margin_bps_max, in: query, description: "Maximum `net_margin_bps`, inclusive", schema: { type: integer } }
        - { name: net_debt_to_equity_bps_min, in: query, description: "Minimum `net_debt_to_equity_bps`, inclusive", schema: { type: integer } }
        - { name: net_debt_to_equity_bps_max, in: query, description: "Maximum `net_debt_to_equity_bps`, inclusive", schema: { type: integer } }
        - { name: liquidity_cents_min, in: query, description: "Minimum `liquidity_cents`, inclusive", schema: { type: integer } }
        - { name: liquidity_cents_max, in: query, description: "Maximum `liquidity_cents`, inclusive", schema: { type: integer } }
        - { name: years_paying_min, in: query, description: "Minimum `years_paying`, inclusive", schema: { type: integer } }
        - { name: years_paying_max, in: query, description: "Maximum `years_paying`, inclusive", schema: { type: integer } }
        - { name: years_with_profit_min, in: query, description: "Minimum `years_with_profit`, inclusive", schema: { type: integer } }
        - { name: years_with_profit_max, in: query, description: "Maximum `years_with_profit`, inclusive", schema: { type: integer } }
        - { name: development_bps_min, in: query, description: "Minimum `development_bps`, inclusive", schema: { type: integer } }
        - { name: development_bps_max, in: query, description: "Maximum `development_bps`, inclusive", schema: { type: integer } }
        - { name: properties_count_min, in: query, description: "Minimum `properties_count`, inclusive", schema: { type: integer } }
        - { name: properties_count_max, in: query, description: "Maximum `properties_count`, inclusive", schema: { type: integer } }
        - { name: largest_property_bps_min, in: query, description: "Minimum `largest_property_bps`, inclusive", schema: { type: integer } }
        - { name: largest_property_bps_max, in: query, description: "Maximum `largest_property_bps`, inclusive", schema: { type: integer } }
        - { name: vacancy_bps_min, in: query, description: "Minimum `vacancy_bps`, inclusive", schema: { type: integer } }
        - { name: vacancy_bps_max, in: query, description: "Maximum `vacancy_bps`, inclusive", schema: { type: integer } }
        - { name: delinquency_bps_min, in: query, description: "Minimum `delinquency_bps`, inclusive", schema: { type: integer } }
        - { name: delinquency_bps_max, in: query, description: "Maximum `delinquency_bps`, inclusive", schema: { type: integer } }
        - { name: largest_tenant_bps_min, in: query, description: "Minimum `largest_tenant_bps`, inclusive", schema: { type: integer } }
        - { name: largest_tenant_bps_max, in: query, description: "Maximum `largest_tenant_bps`, inclusive", schema: { type: integer } }
        - { name: months_paying_12m_min, in: query, description: "Minimum `months_paying_12m`, inclusive", schema: { type: integer } }
        - { name: months_paying_12m_max, in: query, description: "Maximum `months_paying_12m`, inclusive", schema: { type: integer } }
        - { name: hide_single_property, in: query, description: "`true` leaves out FIIs whose latest quarterly report lists a single property for rent; funds without that data stay", schema: { type: boolean } }
        - { name: hide_development, in: query, description: "`true` leaves out FIIs with more than half of the invested total in land, construction or properties for sale; funds without that data stay", schema: { type: boolean } }
        - { name: fund_category, in: query, description: "FIIs: comma-separated `fund_category` values to keep (brick, paper, fund_of_funds, hybrid)", schema: { type: string }, example: "brick,hybrid" }
        - name: sort
          in: query
          schema: { type: string, enum: [ticker, dy_12m_bps, payout_bps, p_vp_e2, p_l_e2, roe_average_bps, earnings_cagr_bps, equity_cagr_bps, net_margin_bps, net_debt_to_equity_bps, liquidity_cents, years_paying, years_with_profit, development_bps, properties_count, largest_property_bps, vacancy_bps, delinquency_bps, largest_tenant_bps, months_paying_12m] }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        "200":
          description: Page of assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Asset" }
                  meta: { $ref: "#/components/schemas/Pagination" }
        "400":
          description: An indicator filter that is not an integer or an unknown `fund_category` (`invalid_filter`), or an unknown sort (`invalid_sort`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /assets/{ticker}:
    get:
      tags: [Assets]
      summary: Show an asset with its latest quote, FII report and distributions
      description: |
        Inactive assets are shown too, so a position in a delisted asset can still be opened. `distributions` lists the
        last 24 months by record date, newest first: FII income from the CVM monthly report (the month's dividend yield
        times the book value per share, with the record date on the month's last day and no payment date) and the
        stock distributions the current user recorded by hand.
      parameters:
        - { name: ticker, in: path, required: true, description: Case insensitive, schema: { type: string }, example: PETR4 }
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AssetDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/categories:
    get:
      tags: [Admin]
      summary: List every category, inactive ones included
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [income, expense] } }
      responses:
        "200":
          description: Categories ordered by kind, position and key
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminCategory" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: Create a category
      description: |
        Clients label known keys in their own language and show `name` for a key they do not know, so write the `name`
        of a new category in the language the families read. `key` and `kind` cannot change later (`immutable`).
        There is no delete: `active: false` hides the category from new entries and keeps the existing ones.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "201": { $ref: "#/components/responses/AdminCategory" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Admin]
      summary: Rename, reorder, change the default nature or deactivate a category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "200": { $ref: "#/components/responses/AdminCategory" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    put:
      tags: [Admin]
      summary: Same as PATCH
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "200": { $ref: "#/components/responses/AdminCategory" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/metrics:
    get:
      tags: [Admin]
      summary: Aggregated usage metrics
      description: Counts only. Never amounts, descriptions or any other content of a user's entries. Anonymized accounts are left out.
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminMetrics" }
        "403": { $ref: "#/components/responses/Forbidden" }
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectionFrom:
      name: projection_from
      in: query
      required: false
      description: |
        First month of the projection to send back in `meta.projection`, recalculated after the change, in the
        `GET /projection` format. With `projection_from` or `projection_months` the answer carries it; without both,
        it does not. A blank value means the current month, as `from` in `GET /projection`.
      schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", example: "2026-05" }
    ProjectionMonths:
      name: projection_months
      in: query
      required: false
      description: Number of months for `meta.projection`, as `months` in `GET /projection`
      schema:
        oneOf:
          - { type: integer, minimum: 1, maximum: 60, default: 12 }
          - { type: string, enum: [all] }
    EntryScope:
      name: scope
      in: query
      required: false
      description: Which entries of the series to change; ignored outside a series
      schema: { type: string, enum: [one, following, all], default: one }
    TokenTransport:
      name: X-Token-Transport
      in: header
      required: false
      description: Send `cookie` to receive the refresh token in an httpOnly cookie
      schema: { type: string, enum: [cookie] }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: object
              description: Validation errors per field
              additionalProperties:
                type: array
                items:
                  type: object
                  properties:
                    code: { type: string, example: too_short }
                    message: { type: string, example: Password is too short (minimum is 8 characters) }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        first_name: { type: string }
        last_name: { type: [string, "null"] }
        full_name: { type: string }
        phone: { type: [string, "null"] }
        role: { type: string, enum: [user, admin] }
        email_confirmed: { type: boolean }
        two_factor_enabled: { type: boolean }
        pending_email: { type: [string, "null"] }
        time_zone: { type: string, example: America/Sao_Paulo, description: "IANA name. Only in the authenticated user's own profile (GET /me)" }
        password_set: { type: boolean, description: "Only in the authenticated user's own profile (GET /me)" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            last_sign_in_at: { type: [string, "null"], format: date-time }
            sign_in_count: { type: integer }
            confirmed_at: { type: [string, "null"], format: date-time }
            failed_login_attempts: { type: integer }
            locked_until: { type: [string, "null"], format: date-time }
            locked: { type: boolean }
            deactivated_at: { type: [string, "null"], format: date-time }
            deactivated: { type: boolean }
    AdminUserInput:
      type: object
      properties:
        email: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string }
        role: { type: string, enum: [user, admin] }
        password: { type: string }
        password_confirmation: { type: string }
    Tokens:
      type: object
      properties:
        token_type: { type: string, example: Bearer }
        access_token: { type: string }
        expires_in: { type: integer, example: 900 }
        expires_at: { type: string, format: date-time }
        refresh_token: { type: string, description: Omitted in cookie mode }
        refresh_token_transport: { type: string, enum: [cookie] }
    SessionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, tokens]
          properties:
            user: { $ref: "#/components/schemas/User" }
            tokens: { $ref: "#/components/schemas/Tokens" }
            two_factor_setup_required: { type: boolean, description: Admins without 2FA must set it up before using the admin area }
    TwoFactorChallengeResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [two_factor_required, challenge_token]
          properties:
            two_factor_required: { type: boolean, const: true }
            challenge_token: { type: string }
            expires_in: { type: integer, example: 300 }
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        current: { type: boolean }
        user_agent: { type: [string, "null"] }
        ip_address: { type: [string, "null"] }
        started_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }
    Identity:
      type: object
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [google, apple] }
        email_at_link: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    ConsentStatus:
      type: object
      properties:
        granted: { type: boolean }
        version: { type: [string, "null"] }
        at: { type: [string, "null"], format: date-time }
        current_version: { type: string }
    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        actor_id: { type: [string, "null"], format: uuid }
        target_type: { type: [string, "null"] }
        target_id: { type: [string, "null"], format: uuid }
        metadata: { type: object }
        ip_address: { type: [string, "null"] }
        user_agent: { type: [string, "null"] }
        request_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [income, expense] }
        key: { type: string, example: salary }
        name: { type: string, example: Salary }
        position: { type: integer }
        default_nature: { type: [string, "null"], enum: [fixed, variable, null], description: Expense categories only }
    AdminCategory:
      allOf:
        - $ref: "#/components/schemas/Category"
        - type: object
          required: [active]
          properties:
            active: { type: boolean }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    CategoryInput:
      type: object
      properties:
        kind: { type: string, enum: [income, expense], description: Only on create }
        key: { type: string, pattern: "^[a-z][a-z0-9_]*$", maxLength: 50, description: Only on create; clients translate by it }
        name: { type: string, maxLength: 100, description: Display text for clients that do not know the key }
        position: { type: integer, minimum: 0 }
        default_nature: { type: [string, "null"], enum: [fixed, variable, null], description: Required for expense categories; income has none }
        active: { type: boolean }
    InvestmentTransaction:
      type: object
      required: [id, ticker, kind, traded_on, quantity, price_cents, fees_cents, entry_id]
      properties:
        id: { type: string, format: uuid }
        ticker: { type: string, example: PETR4 }
        kind: { type: string, enum: [buy, sell, split, reverse_split, bonus] }
        traded_on: { type: string, format: date }
        quantity: { type: integer, minimum: 1, description: Shares bought or sold, or added (split, bonus) or removed (reverse split) }
        price_cents: { type: [integer, "null"], minimum: 1, description: Price per share; buys and sells only }
        fees_cents: { type: integer, minimum: 0 }
        entry_id: { type: [string, "null"], format: uuid, description: The expense or income created by `debit_balance` }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    InvestmentTransactionInput:
      type: object
      properties:
        ticker: { type: string, description: Any asset of the catalog, including inactive ones; only on create }
        kind: { type: string, enum: [buy, sell, split, reverse_split, bonus] }
        traded_on: { type: string, format: date, description: Today or a past date }
        quantity: { type: integer, minimum: 1, maximum: 1000000000 }
        price_cents: { type: [integer, "null"], minimum: 1, maximum: 10000000000000, description: Required for buys and sells, absent otherwise }
        fees_cents: { type: integer, minimum: 0, maximum: 10000000000000, default: 0, description: Buys and sells only }
        goal: { type: string, enum: [income, growth], description: Only when the transaction opens the position }
        debit_balance: { type: boolean, default: false, description: Buys and sells only }
    InvestmentPosition:
      type: object
      required: [ticker, goal]
      properties:
        ticker: { type: string }
        goal: { type: string, enum: [income, growth] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PortfolioTotals:
      type: object
      required: [contributed_cents, cost_cents, market_value_cents, gain_cents, realized_cents]
      properties:
        contributed_cents: { type: integer, description: Buys with fees minus sale proceeds net of fees }
        cost_cents: { type: integer, description: Cost of the shares held, at the average price }
        market_value_cents: { type: integer }
        gain_cents: { type: integer, description: Market value minus cost; may be negative }
        realized_cents: { type: integer, description: Profit or loss of the sales; may be negative }
    PortfolioPosition:
      type: object
      required: [ticker, name, asset_type, goal, quantity, average_price_e8, cost_cents, contributed_cents, realized_cents, quote, market_value_cents, gain_cents]
      properties:
        ticker: { type: string }
        name: { type: string }
        asset_type: { type: string, enum: [stock, fii] }
        goal: { type: string, enum: [income, growth] }
        quantity: { type: integer, minimum: 0 }
        average_price_e8: { type: integer, description: "Average price per share in hundred-millionths of a real (R$ 12.34 is 1234000000)" }
        cost_cents: { type: integer }
        contributed_cents: { type: integer }
        realized_cents: { type: integer }
        quote:
          oneOf:
            - { $ref: "#/components/schemas/AssetQuote" }
            - { type: "null" }
        market_value_cents: { type: integer, description: Shares times the latest close, or the cost without a quote }
        gain_cents: { type: integer }
    AllocationTarget:
      type: object
      required: [id, name, mode, amount_cents, percent_bps, reserve_account_id, category_id, position]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        mode: { type: string, enum: [fixed, percent, remainder] }
        amount_cents: { type: [integer, "null"], description: Fixed destinations only }
        percent_bps: { type: [integer, "null"], description: "Percentage of the month's balance in basis points (10% is 1000); percent destinations only" }
        reserve_account_id: { type: [string, "null"], format: uuid }
        category_id: { type: [string, "null"], format: uuid, description: An expense category that labels the destination }
        position: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AllocationTargetInput:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        mode: { type: string, enum: [fixed, percent, remainder] }
        amount_cents: { type: [integer, "null"], minimum: 1, maximum: 10000000000000 }
        percent_bps: { type: [integer, "null"], minimum: 1, maximum: 10000 }
        reserve_account_id: { type: [string, "null"], format: uuid }
        category_id: { type: [string, "null"], format: uuid, description: An active expense category }
        position: { type: integer, minimum: 0 }
    AllocationPlan:
      type: object
      required: [month, closing_cents, base_cents, used_cents, planned_cents, unallocated_cents, items]
      properties:
        month: { type: string, example: "2026-11" }
        closing_cents: { type: integer, description: The month's projected closing balance, after what was used }
        base_cents: { type: integer, description: The closing balance plus what was used in the month }
        used_cents: { type: integer }
        planned_cents: { type: integer, description: Used plus still planned }
        unallocated_cents: { type: integer, description: Base minus planned }
        items:
          type: array
          items:
            type: object
            required: [target_id, name, mode, amount_cents, percent_bps, reserve_account_id, category_id, used, allocation_id, used_on]
            properties:
              target_id: { type: string, format: uuid }
              name: { type: string }
              mode: { type: string, enum: [fixed, percent, remainder] }
              amount_cents: { type: integer, minimum: 0, description: The amount used, or else the planned amount }
              percent_bps: { type: [integer, "null"] }
              reserve_account_id: { type: [string, "null"], format: uuid }
              category_id: { type: [string, "null"], format: uuid }
              used: { type: boolean }
              allocation_id: { type: [string, "null"], format: uuid }
              used_on: { type: [string, "null"], format: date }
    Allocation:
      type: object
      required: [id, target_id, entry_id, month, amount_cents, used_on]
      properties:
        id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        entry_id: { type: string, format: uuid, description: The paid expense that took the money out of the balance }
        month: { type: string, example: "2026-11" }
        amount_cents: { type: integer }
        used_on: { type: string, format: date }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ReserveAccount:
      type: object
      required: [id, name, kind, cdi_percent_bps, annual_rate_bps, tax_exempt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        kind: { type: string, enum: [selic_treasury, cdb, savings, idle, fixed_rate] }
        cdi_percent_bps: { type: [integer, "null"], description: "Percentage of the CDI in basis points (110% is 11000); CDB only" }
        annual_rate_bps: { type: [integer, "null"], description: "Annual rate in basis points (12% is 1200); fixed rate only" }
        tax_exempt: { type: boolean, description: LCI or LCA }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ReserveAccountInput:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        kind: { type: string, enum: [selic_treasury, cdb, savings, idle, fixed_rate] }
        cdi_percent_bps: { type: [integer, "null"], minimum: 1, maximum: 50000 }
        annual_rate_bps: { type: [integer, "null"], minimum: 1, maximum: 10000 }
        tax_exempt: { type: boolean, default: false }
    ReserveMovement:
      type: object
      required: [id, account_id, kind, moved_on, amount_cents, entry_id]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        kind: { type: string, enum: [anchor, deposit, withdrawal] }
        moved_on: { type: string, format: date }
        amount_cents: { type: integer, minimum: 0 }
        entry_id: { type: [string, "null"], format: uuid, description: The expense or income created by `debit_balance` }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ReserveMovementInput:
      type: object
      properties:
        account_id: { type: string, format: uuid, description: Only on create }
        kind: { type: string, enum: [anchor, deposit, withdrawal] }
        moved_on: { type: string, format: date, description: Today or a past date }
        amount_cents: { type: integer, minimum: 0, maximum: 10000000000000, description: Zero only on an anchor }
        debit_balance: { type: boolean, default: false, description: Deposits and withdrawals only }
    ReserveValue:
      type: object
      required: [gross_cents, net_cents, invested_cents, yield_cents, tax_cents]
      properties:
        gross_cents: { type: integer }
        net_cents: { type: integer, description: Gross minus the estimated income tax }
        invested_cents: { type: integer, description: Deposits still in the account, at cost }
        yield_cents: { type: integer }
        tax_cents: { type: integer }
    ReserveSummary:
      type: object
      required: [totals, accounts, suggestion, goal, alerts, rates_as_of]
      properties:
        totals: { $ref: "#/components/schemas/ReserveValue" }
        accounts:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/ReserveAccount" }
              - { $ref: "#/components/schemas/ReserveValue" }
        suggestion:
          type: [object, "null"]
          required: [average_fixed_cents, months_counted, goal_months, suggested_cents, coverage_months_e2]
          properties:
            average_fixed_cents: { type: integer }
            months_counted: { type: integer, minimum: 1, maximum: 3 }
            goal_months: { type: integer }
            suggested_cents: { type: integer }
            coverage_months_e2: { type: integer, description: "Net total over the average, in hundredths of a month (420 is 4.2 months)" }
        goal:
          type: object
          required: [months, cents, target_cents]
          properties:
            months: { type: integer, minimum: 1, maximum: 24 }
            cents: { type: [integer, "null"], description: The amount the user set, if any }
            target_cents: { type: [integer, "null"], description: "`cents`, or the suggestion without it" }
        alerts:
          type: array
          items: { type: string, enum: [no_reserve, below_suggestion, idle_money] }
        rates_as_of: { type: [string, "null"], format: date, description: Date of the latest imported Selic }
    ReserveGoalInput:
      type: object
      properties:
        goal_months: { type: integer, minimum: 1, maximum: 24 }
        goal_cents: { type: [integer, "null"], minimum: 1, maximum: 10000000000000, description: "`null` goes back to the suggestion" }
    ReserveAssumptions:
      type: object
      required: [selic_target_e8, cdi_estimate_e8, savings_monthly_e8, rates_as_of, holidays_ignored, iof_ignored]
      properties:
        selic_target_e8: { type: [integer, "null"], description: "Annual Selic target in hundred-millionths (13.75% is 13750000)" }
        cdi_estimate_e8: { type: [integer, "null"], description: The Selic target minus 0.10 point }
        savings_monthly_e8: { type: [integer, "null"], description: The last monthly savings yield }
        rates_as_of: { type: [string, "null"], format: date }
        holidays_ignored: { type: boolean }
        iof_ignored: { type: boolean }
    Asset:
      type: object
      required: [ticker, name, asset_type, sector, indicators]
      properties:
        ticker: { type: string, pattern: "^[A-Z][A-Z0-9]{3}[0-9]{1,2}B?$", example: PETR4 }
        name: { type: string, example: PETROLEO BRASILEIRO S.A. PETROBRAS }
        asset_type: { type: string, enum: [stock, fii] }
        sector: { type: [string, "null"], description: "Company sector or FII segment, from CVM", example: Petróleo e Gás }
        indicators:
          description: Null until the next daily refresh after the asset is listed
          oneOf:
            - { $ref: "#/components/schemas/AssetIndicators" }
            - { type: "null" }
    AssetIndicators:
      type: object
      description: |
        Computed every weekday from the latest quote, the CVM distributions of FIIs and the companies' annual
        statements (DFP, consolidated when available). Any indicator is null when its data is missing or its base is
        zero or negative. `_bps` values are hundredths of a percent and `_e2` values are hundredths. Informational
        only, never investment advice.
      required: [computed_on, price_cents, dy_12m_bps, distribution_average_e8, distribution_median_e8, years_paying, payout_bps, p_vp_e2,
        p_l_e2, roe_average_bps, earnings_cagr_bps, equity_cagr_bps, years_with_profit, net_margin_bps, net_debt_to_equity_bps,
        liquidity_cents, financial_years, fund_category, development_bps, properties_count, largest_property_bps, vacancy_bps,
        delinquency_bps, largest_tenant_bps, months_paying_12m]
      properties:
        computed_on: { type: string, format: date }
        price_cents: { type: [integer, "null"], description: Latest close }
        dy_12m_bps: { type: [integer, "null"], description: "FIIs: CVM distributions of the last 12 months over the price; stocks: dividends and JCP paid in the last fiscal year (cash flow statement) over the market value" }
        distribution_average_e8: { type: [integer, "null"], description: "FIIs: average monthly distribution per share in the last 12 months" }
        distribution_median_e8: { type: [integer, "null"], description: "FIIs: median monthly distribution per share in the last 12 months" }
        years_paying: { type: [integer, "null"], description: Consecutive calendar (FIIs) or fiscal (stocks) years with distributions up to the latest one; 0 for a FII whose latest distribution is older than last year }
        payout_bps: { type: [integer, "null"], description: "Stocks: dividends and JCP paid over the net income of the last fiscal year" }
        p_vp_e2: { type: [integer, "null"], description: "Price to book value: FIIs from the latest monthly report, stocks from the market value over equity" }
        p_l_e2: { type: [integer, "null"], description: "Stocks: market value over the last fiscal year's net income" }
        roe_average_bps: { type: [integer, "null"], description: "Stocks: average net income over equity of the last 5 fiscal years" }
        earnings_cagr_bps: { type: [integer, "null"], description: "Stocks: yearly growth of net income over up to 5 years (at least 2)" }
        equity_cagr_bps: { type: [integer, "null"], description: "Stocks: yearly growth of equity over up to 5 years (at least 2)" }
        years_with_profit: { type: [integer, "null"], description: "Stocks: fiscal years with a profit among the last 5" }
        net_margin_bps: { type: [integer, "null"], description: "Stocks: net income over revenue of the last fiscal year" }
        net_debt_to_equity_bps: { type: [integer, "null"], description: "Stocks: loans minus cash and short-term investments over equity; null for banks" }
        liquidity_cents: { type: [integer, "null"], description: Average daily traded volume in the last 30 days }
        financial_years: { type: [integer, "null"], description: "Stocks: fiscal years among the last 5 with statements" }
        fund_category: { type: [string, "null"], enum: [brick, paper, fund_of_funds, hybrid, null], description: "FIIs: what the latest monthly report holds, by value: properties and real estate companies (brick), real estate receivables and credit notes (paper), other FIIs (fund_of_funds), each with at least two thirds, or a mix (hybrid)" }
        development_bps: { type: [integer, "null"], description: "FIIs: land, properties under construction and properties for sale over the invested total of the latest monthly report" }
        properties_count: { type: [integer, "null"], description: "FIIs: properties for rent, finished or under construction, in the latest quarterly report; 1 means a single-property fund" }
        largest_property_bps: { type: [integer, "null"], description: "FIIs: the largest share of the fund's revenue coming from one property" }
        vacancy_bps: { type: [integer, "null"], description: "FIIs: vacancy of the finished properties for rent, weighted by area" }
        delinquency_bps: { type: [integer, "null"], description: "FIIs: delinquency of the properties for rent, weighted by their share of revenue" }
        largest_tenant_bps: { type: [integer, "null"], description: "FIIs: the largest share of the fund's revenue coming from one tenant (CVM lists tenants above 5%)" }
        months_paying_12m: { type: [integer, "null"], description: "FIIs: months with a CVM distribution in the last 12" }
    IncomeSimulation:
      type: object
      required: [kind, ticker, price_cents, monthly_income_per_share_e8, monthly_yield_bps, reinvest, months, summary]
      properties:
        kind: { type: string, enum: [income] }
        ticker: { type: [string, "null"] }
        price_cents: { type: [integer, "null"] }
        monthly_income_per_share_e8: { type: [integer, "null"] }
        monthly_yield_bps: { type: [integer, "null"] }
        reinvest: { type: boolean }
        months:
          type: array
          items:
            type: object
            required: [month, contributed_cents, shares, value_cents, income_cents, received_cents]
            properties:
              month: { type: integer, minimum: 1 }
              contributed_cents: { type: integer }
              shares: { type: [integer, "null"], description: Null without `ticker` }
              value_cents: { type: integer, description: Shares at the constant price plus the money not yet invested }
              income_cents: { type: integer, description: Income of the month }
              received_cents: { type: integer, description: Income received up to the month }
        summary:
          type: object
          required: [contributed_cents, value_cents, monthly_income_cents, received_cents, target_monthly_income_cents, shares_for_target,
            capital_for_target_cents, months_to_target]
          properties:
            contributed_cents: { type: integer }
            value_cents: { type: integer }
            monthly_income_cents: { type: integer }
            received_cents: { type: integer }
            target_monthly_income_cents: { type: [integer, "null"] }
            shares_for_target: { type: [integer, "null"] }
            capital_for_target_cents: { type: [integer, "null"], description: Money needed today to reach the target }
            months_to_target: { type: [integer, "null"], description: First simulated month whose income reaches the target }
    GrowthSimulation:
      type: object
      required: [kind, annual_rate_bps, monthly_rate_e8, months, summary]
      properties:
        kind: { type: string, enum: [growth] }
        annual_rate_bps: { type: integer }
        monthly_rate_e8: { type: integer, description: Equivalent monthly rate in hundred-millionths }
        months:
          type: array
          items: { $ref: "#/components/schemas/GrowthMonth" }
        summary:
          type: object
          required: [contributed_cents, value_cents, earnings_cents]
          properties:
            contributed_cents: { type: integer }
            value_cents: { type: integer }
            earnings_cents: { type: integer }
    GrowthMonth:
      type: object
      required: [month, contributed_cents, value_cents, earnings_cents]
      properties:
        month: { type: integer, minimum: 1 }
        contributed_cents: { type: integer }
        value_cents: { type: integer }
        earnings_cents: { type: integer }
    AssetDetail:
      allOf:
        - $ref: "#/components/schemas/Asset"
        - type: object
          required: [isin, cnpj, active, quote, fund_report, composition, distributions]
          properties:
            composition:
              description: Properties from the latest CVM quarterly report; FIIs with properties only
              oneOf:
                - { $ref: "#/components/schemas/FundComposition" }
                - { type: "null" }
            fund_report:
              description: Latest CVM monthly report; FIIs only
              oneOf:
                - { $ref: "#/components/schemas/FundReport" }
                - { type: "null" }
            distributions:
              type: array
              items: { $ref: "#/components/schemas/AssetDistribution" }
            isin: { type: string, example: BRPETRACNPR6 }
            cnpj: { type: [string, "null"], pattern: "^[0-9]{14}$", description: "Digits only; null until matched with CVM" }
            active: { type: boolean, description: Has a quote in the last 30 days }
            quote:
              oneOf:
                - { $ref: "#/components/schemas/AssetQuote" }
                - { type: "null" }
    FundComposition:
      type: object
      required: [reference_on, largest_tenant_bps, properties]
      properties:
        reference_on: { type: string, format: date, description: Last day of the quarter }
        largest_tenant_bps: { type: [integer, "null"], description: The largest share of the fund's revenue coming from one tenant }
        properties:
          type: array
          description: The largest share of revenue first
          items:
            type: object
            required: [name, kind, area_m2, vacancy_bps, delinquency_bps, revenue_share_bps]
            properties:
              name: { type: string, example: HGLG Betim Business Park }
              kind: { type: string, enum: [rent, rent_construction, sale, sale_construction] }
              area_m2: { type: [integer, "null"] }
              vacancy_bps: { type: [integer, "null"] }
              delinquency_bps: { type: [integer, "null"] }
              revenue_share_bps: { type: [integer, "null"], description: Share of the fund's revenue }
    FundReport:
      type: object
      required: [reference_month, equity_cents, book_value_per_share_e8, shares_count, shareholders_count, category, development_bps]
      properties:
        category: { type: [string, "null"], enum: [brick, paper, fund_of_funds, hybrid, null] }
        development_bps: { type: [integer, "null"] }
        reference_month: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
        equity_cents: { type: integer }
        book_value_per_share_e8: { type: integer, description: Book value per share in hundred-millionths of a real }
        shares_count: { type: integer }
        shareholders_count: { type: integer }
    AssetDistribution:
      type: object
      required: [id, ticker, kind, source, record_on, paid_on, amount_per_share_e8, net_amount_per_share_e8]
      properties:
        id: { type: string, format: uuid }
        ticker: { type: string, example: PETR4 }
        kind: { type: string, enum: [fii_income, dividend, jcp] }
        source: { type: string, enum: [cvm, manual], description: "`cvm`: FII monthly report; `manual`: recorded by the current user" }
        record_on: { type: string, format: date, description: Record date (data com) }
        paid_on: { type: [string, "null"], format: date, description: Null for FII income from CVM }
        amount_per_share_e8: { type: integer, minimum: 1, description: Gross value per share in hundred-millionths of a real }
        net_amount_per_share_e8: { type: integer, minimum: 1, description: JCP net of the 15% income tax; the gross value otherwise }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssetDistributionInput:
      type: object
      properties:
        ticker: { type: string, description: A stock of the user's portfolio; only on create }
        kind: { type: string, enum: [dividend, jcp] }
        record_on: { type: string, format: date }
        paid_on: { type: string, format: date, description: On or after `record_on` }
        amount_per_share_e8: { type: integer, minimum: 1, maximum: 100000000000000 }
    IncomeMonth:
      type: object
      required: [month, amount_cents]
      properties:
        month: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", example: "2026-11" }
        amount_cents: { type: integer, minimum: 0 }
    AssetQuote:
      type: object
      required: [quoted_on, close_cents, volume_cents, trades_count]
      properties:
        quoted_on: { type: string, format: date, description: Trading day }
        close_cents: { type: integer, minimum: 1, description: Closing price per share or quota }
        volume_cents: { type: integer, minimum: 0, description: Traded volume of the day }
        trades_count: { type: integer, minimum: 0 }
    Balance:
      type: object
      properties:
        id: { type: string, format: uuid }
        amount_cents: { type: integer, minimum: -10000000000000, maximum: 10000000000000, description: May be negative }
        as_of: { type: string, format: date }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BalanceInput:
      type: object
      required: [amount_cents, as_of]
      properties:
        amount_cents: { type: integer, minimum: -10000000000000, maximum: 10000000000000 }
        as_of: { type: string, format: date, description: Today or a past date }
    Entry:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [income, expense] }
        nature: { type: [string, "null"], enum: [fixed, variable, null], description: Expenses only }
        category_id: { type: string, format: uuid }
        description: { type: string, maxLength: 200 }
        amount_cents: { type: integer, minimum: 1, maximum: 10000000000000 }
        due_on: { type: string, format: date }
        status: { type: string, enum: [pending, paid] }
        paid_on: { type: [string, "null"], format: date }
        series_id: { type: [string, "null"], format: uuid, description: Series the entry was created with }
        series_position: { type: [integer, "null"], minimum: 1, description: Position in the series by due date }
        series_kind: { type: [string, "null"], enum: [recurring, installments, null] }
        series_count: { type: [integer, "null"], minimum: 1, description: Entries in the series, for labels like 3/10 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EntryInput:
      type: object
      required: [category_id, description, amount_cents, due_on]
      properties:
        category_id: { type: string, format: uuid }
        nature: { type: [string, "null"], enum: [fixed, variable, null], description: Expenses only; defaults to the category's default_nature }
        description: { type: string, maxLength: 200 }
        amount_cents: { type: integer, minimum: 1, maximum: 10000000000000 }
        due_on: { type: string, format: date }
        status: { type: string, enum: [pending, paid], default: pending }
        paid_on: { type: [string, "null"], format: date, description: Only when status is paid }
    EntrySeriesInput:
      type: object
      required: [category_id, description, due_on, entries_count]
      properties:
        kind: { type: string, enum: [recurring, installments], default: recurring }
        category_id: { type: string, format: uuid }
        nature: { type: [string, "null"], enum: [fixed, variable, null], description: Expenses only; defaults to the category's default_nature }
        description: { type: string, maxLength: 200 }
        amount_cents: { type: integer, minimum: 1, maximum: 10000000000000, description: Recurring only; the amount of every entry }
        total_cents: { type: integer, maximum: 10000000000000, description: Installments only; at least one cent per installment }
        due_on: { type: string, format: date, description: Due date of the first entry sent }
        status: { type: string, enum: [pending, paid], default: pending }
        paid_on: { type: [string, "null"], format: date, description: Only when status is paid }
        entries_count: { type: integer, minimum: 2, maximum: 48, description: Number of entries, the first included; up to 36 for recurring }
        direction: { type: string, enum: [forward, backward], description: Recurring only; following or previous months }
        interval_months: { type: integer, enum: [1, 3, 6, 12], default: 1, description: Recurring only; months between two entries }
    EntrySeries:
      type: object
      required: [id, kind, interval_months, entries_count, entries]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [recurring, installments] }
        interval_months: { type: integer, enum: [1, 3, 6, 12], description: Months between two entries; always 1 for installments }
        entries_count: { type: integer }
        total_cents: { type: [integer, "null"], description: Installments only }
        created_at: { type: string, format: date-time }
        entries:
          type: array
          items: { $ref: "#/components/schemas/Entry" }
    NotificationSettings:
      type: object
      required: [due_alerts_enabled, due_alert_days_before]
      properties:
        due_alerts_enabled: { type: boolean, default: true }
        due_alert_days_before: { type: integer, minimum: 0, maximum: 7, default: 1 }
    NotificationSettingsInput:
      type: object
      properties:
        due_alerts_enabled: { type: boolean }
        due_alert_days_before: { type: integer, minimum: 0, maximum: 7, description: "Outside 0 to 7 answers `inclusion`" }
    ChangeMeta:
      type: object
      properties:
        projection: { $ref: "#/components/schemas/Projection" }
        entries:
          type: array
          description: Every entry left in the changed entry's series
          items: { $ref: "#/components/schemas/Entry" }
    Projection:
      type: object
      required: [anchor, months, alerts, last_entry_month]
      properties:
        last_entry_month: { type: [string, "null"], example: "2028-08", description: Month of the user's latest entry due date (simulated entries included); null without entries }
        anchor:
          type: [object, "null"]
          required: [amount_cents, as_of]
          properties:
            amount_cents: { type: integer }
            as_of: { type: string, format: date }
        months:
          type: array
          items: { $ref: "#/components/schemas/ProjectionMonth" }
        alerts:
          type: object
          required: [first_negative_month, negative_months_count]
          properties:
            first_negative_month: { type: [string, "null"], example: "2027-03", description: First projected month that closes below zero }
            negative_months_count: { type: integer, minimum: 0 }
    ProjectionMonth:
      type: object
      required: [month, opening_cents, income_cents, expense_cents, fixed_expense_cents, variable_expense_cents, closing_cents, savings_cents, negative, reserve_cents, investment_income_cents, investments_value_cents, net_worth_cents, expense_by_category]
      properties:
        month: { type: string, example: "2026-11" }
        opening_cents: { type: integer }
        income_cents: { type: integer, description: Income entries plus `investment_income_cents` }
        expense_cents: { type: integer }
        fixed_expense_cents: { type: integer }
        variable_expense_cents: { type: integer }
        closing_cents: { type: integer, description: May be negative }
        savings_cents: { type: integer, description: Income minus expenses from the first projected month through this one; may be negative }
        negative: { type: boolean, description: The month closes below zero }
        reserve_cents: { type: integer, description: Net value of the emergency reserve on the month's last day, as in `GET /reserve/projection` }
        investment_income_cents: { type: integer, minimum: 0, description: Forecast distributions of the portfolio, as in `GET /portfolio/income`; zero up to the current month or with `include_investment_income=false` }
        investments_value_cents: { type: integer, minimum: 0, description: "Portfolio value as in `GET /portfolio/history`; months after the current one repeat today's value, with no forecast appreciation" }
        net_worth_cents: { type: integer, description: "`closing_cents` plus `reserve_cents` plus `investments_value_cents`" }
        expense_by_category:
          type: array
          description: Expenses of the month summed by category, largest first (ties by key)
          items:
            type: object
            required: [category_key, amount_cents]
            properties:
              category_key: { type: string, example: housing }
              amount_cents: { type: integer, minimum: 0 }
    AdminMetrics:
      type: object
      required: [users, engagement, signups_by_week]
      properties:
        users:
          type: object
          required: [total, confirmed, active_30d, new_30d, deactivated, with_two_factor]
          properties:
            total: { type: integer }
            confirmed: { type: integer }
            active_30d: { type: integer, description: Signed in during the last 30 days }
            new_30d: { type: integer, description: Signed up during the last 30 days }
            deactivated: { type: integer }
            with_two_factor: { type: integer }
        engagement:
          type: object
          required: [with_balance, with_entries, with_5_series, entries_created_30d, with_portfolio, investment_transactions_30d, positions_by_goal, with_reserve, reserve_accounts_by_kind]
          properties:
            with_balance: { type: integer, description: Users with at least one balance }
            with_entries: { type: integer, description: Users with at least one entry }
            with_5_series: { type: integer, description: Users with at least five series }
            entries_created_30d: { type: integer }
            with_portfolio: { type: integer, description: Users with at least one investment position }
            investment_transactions_30d: { type: integer }
            positions_by_goal:
              type: object
              required: [income, growth]
              properties:
                income: { type: integer }
                growth: { type: integer }
            with_reserve: { type: integer, description: Users with at least one emergency reserve account }
            reserve_accounts_by_kind:
              type: object
              required: [selic_treasury, cdb, savings, idle, fixed_rate]
              properties:
                selic_treasury: { type: integer }
                cdb: { type: integer }
                savings: { type: integer }
                idle: { type: integer }
                fixed_rate: { type: integer }
        signups_by_week:
          type: array
          description: The last 12 weeks, oldest first
          items:
            type: object
            required: [week, count]
            properties:
              week: { type: string, format: date, description: Monday of the week }
              count: { type: integer }
    Pagination:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        pages: { type: integer }
        next: { type: [integer, "null"] }
        prev: { type: [integer, "null"] }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    Reauthentication:
      type: object
      properties:
        current_password: { type: string, description: "Required when password_set is true" }
        code: { type: string, description: "Required when 2FA is enabled; also the way to re-authenticate when the account has no password" }
        provider: { type: string, enum: [google, apple], description: "Provider of id_token; defaults to google" }
        id_token: { type: string, description: "Fresh provider ID token of an account already linked; re-authenticates an account without a password" }
  responses:
    AllocationTarget:
      description: Destination of the month's leftover balance
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/AllocationTarget" }
    ReserveAccount:
      description: Emergency reserve account
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/ReserveAccount" }
    ReserveMovement:
      description: Emergency reserve movement
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/ReserveMovement" }
    ReserveSummary:
      description: Emergency reserve
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/ReserveSummary" }
    DeletedId:
      description: Deleted
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [deleted_id]
                properties:
                  deleted_id: { type: string, format: uuid }
    InvestmentTransaction:
      description: Investment transaction
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/InvestmentTransaction" }
    AssetDistribution:
      description: Distribution
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/AssetDistribution" }
    InvestmentPosition:
      description: Investment position
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/InvestmentPosition" }
    AdminCategory:
      description: Category
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/AdminCategory" }
    NotificationSettings:
      description: Notification settings
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/NotificationSettings" }
    Entry:
      description: Entry
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/Entry" }
              meta: { $ref: "#/components/schemas/ChangeMeta" }
    Balance:
      description: Balance
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/Balance" }
              meta: { $ref: "#/components/schemas/ChangeMeta" }
    Session:
      description: Session created
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SessionResponse" }
    Message:
      description: Message
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  message: { type: string }
    BackupCodes:
      description: Backup codes (show them only once)
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  backup_codes: { type: array, items: { type: string } }
    Deleted:
      description: Deleted
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [deleted_ids]
                properties:
                  deleted_ids: { type: array, items: { type: string, format: uuid } }
              meta: { $ref: "#/components/schemas/ChangeMeta" }
    BadRequest:
      description: Missing parameter, invalid JSON or an invalid projection period (`invalid_month`, `invalid_months`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not authenticated / invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AdminUser:
      description: User as seen by an admin
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/AdminUser" }
    Forbidden:
      description: Forbidden (includes `two_factor_setup_required` and `email_not_confirmed`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Invalid data (`validation_failed`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ReauthenticationFailed:
      description: Wrong current password, 2FA code or provider token, or no way to re-authenticate (`invalid_current_password`, `invalid_two_factor_code`, `invalid_provider_token`, `provider_unavailable`, `reauthentication_unavailable`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests (`rate_limited`, Retry-After header)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
